<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intex South Asia | The Textile Archive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'archive-clay': '#EE7539',
            'archive-charcoal': '#2F2C2C',
            'archive-bronze': '#EE7539',
            'archive-cream': '#F3EBE8',
          },
          fontFamily: {
            serif: ['Roboto', 'sans-serif'],
            sans: ['Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg: #F3EBE8;
      --text: #2F2C2C;
      --accent: #EE7539;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Roboto', sans-serif;
      margin: 0;
      overflow-x: hidden;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: 'Roboto', sans-serif;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: #F3EBE8;
    }

    ::-webkit-scrollbar-thumb {
      background: #2F2C2C;
    }

    * {
      box-shadow: none !important;
      outline: none !important;
    }

    .text-outline {
      -webkit-text-stroke: 1px #EE7539;
      color: transparent;
    }

    .grid-border-fix>* {
      margin-left: -1px;
      margin-top: -1px;
    }

    .measuring-tape {
      background-image: repeating-linear-gradient(90deg, #EE7539, #EE7539 1px, transparent 1px, transparent 10px);
      background-size: 100px 100%;
    }

    .measuring-tape::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: repeating-linear-gradient(90deg, #EE7539, #EE7539 1px, transparent 1px, transparent 2px);
      background-size: 10px 100%;
    }

    @media (min-width: 768px) {
      /* Overrides for responsive md: utility classes on h1, h2, h3 on big screens (increased by 20% over original size) */
      h1.md\:text-8xl, h2.md\:text-8xl, h3.md\:text-8xl { font-size: 7.2rem !important; }
      h1.md\:text-7xl, h2.md\:text-7xl, h3.md\:text-7xl { font-size: 5.4rem !important; }
      h1.md\:text-6xl, h2.md\:text-6xl, h3.md\:text-6xl { font-size: 4.5rem !important; }
      h1.md\:text-5xl, h2.md\:text-5xl, h3.md\:text-5xl { font-size: 3.6rem !important; }
      h1.md\:text-4xl, h2.md\:text-4xl, h3.md\:text-4xl { font-size: 2.7rem !important; }
      h1.md\:text-3xl, h2.md\:text-3xl, h3.md\:text-3xl { font-size: 2.25rem !important; }
      h1.md\:text-2xl, h2.md\:text-2xl, h3.md\:text-2xl { font-size: 1.8rem !important; }
      h1.md\:text-xl, h2.md\:text-xl, h3.md\:text-xl { font-size: 1.5rem !important; }
      h1.md\:text-lg, h2.md\:text-lg, h3.md\:text-lg { font-size: 1.35rem !important; }
      h1.md\:text-base, h2.md\:text-base, h3.md\:text-base { font-size: 1.2rem !important; }
      h1.md\:text-sm, h2.md\:text-sm, h3.md\:text-sm { font-size: 1.05rem !important; }
      h1.md\:text-xs, h2.md\:text-xs, h3.md\:text-xs { font-size: 0.9rem !important; }
      h1.md\:text-\[10rem\], h2.md\:text-\[10rem\], h3.md\:text-\[10rem\] { font-size: 12.0rem !important; }
      h1.md\:text-\[8rem\], h2.md\:text-\[8rem\], h3.md\:text-\[8rem\] { font-size: 9.6rem !important; }

      /* Overrides for standard utility classes on h1, h2, h3 on big screens (increased by 20% over original size) */
      h1.text-8xl, h2.text-8xl, h3.text-8xl { font-size: 7.2rem !important; }
      h1.text-7xl, h2.text-7xl, h3.text-7xl { font-size: 5.4rem !important; }
      h1.text-6xl, h2.text-6xl, h3.text-6xl { font-size: 4.5rem !important; }
      h1.text-5xl, h2.text-5xl, h3.text-5xl { font-size: 3.6rem !important; }
      h1.text-4xl, h2.text-4xl, h3.text-4xl { font-size: 2.7rem !important; }
      h1.text-3xl, h2.text-3xl, h3.text-3xl { font-size: 2.25rem !important; }
      h1.text-2xl, h2.text-2xl, h3.text-2xl { font-size: 1.8rem !important; }
      h1.text-xl, h2.text-xl, h3.text-xl { font-size: 1.5rem !important; }
      h1.text-lg, h2.text-lg, h3.text-lg { font-size: 1.35rem !important; }
      h1.text-base, h2.text-base, h3.text-base { font-size: 1.2rem !important; }
      h1.text-sm, h2.text-sm, h3.text-sm { font-size: 1.05rem !important; }
      h1.text-xs, h2.text-xs, h3.text-xs { font-size: 0.9rem !important; }
      h1.text-\[10rem\], h2.text-\[10rem\], h3.text-\[10rem\] { font-size: 12.0rem !important; }
      h1.text-\[8rem\], h2.text-\[8rem\], h3.text-\[8rem\] { font-size: 9.6rem !important; }
    }
  </style>
